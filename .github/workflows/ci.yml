name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install black isort flake8 mypy
      - run: black --check --diff src/ tests/
      - run: isort --check-only src/ tests/
      - run: flake8 src/ tests/ --max-line-length 100

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }

      - name: Install system deps (OpenCV)
        run: sudo apt-get install -y libgl1

      - name: Install Python deps
        run: |
          pip install numpy pandas opencv-python-headless cryptography pyyaml Pillow scipy
          pip install pytest pytest-cov

      - name: Run unit tests
        run: pytest tests/unit/ -v --cov=privacy_pipeline --cov-report=xml -m "not mysql"

      - name: Run integration tests (SQLite)
        run: pytest tests/integration/ -v -m "not mysql"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with: { file: coverage.xml, token: "${{ secrets.CODECOV_TOKEN }}" }

  test-mysql:
    name: Tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: privacy_pipeline_db
          MYSQL_USER: pp_user
          MYSQL_PASSWORD: pp_test_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y libgl1
      - run: pip install numpy pandas opencv-python-headless cryptography pyyaml Pillow mysql-connector-python pytest
      - name: Run MySQL migration
        env:
          PPVP_DB_PASSWORD: pp_test_password
          PPVP_DB_HOST: 127.0.0.1
          PPVP_DB_USER: pp_user
          PPVP_DB_NAME: privacy_pipeline_db
        run: mysql -h 127.0.0.1 -u pp_user -ppp_test_password privacy_pipeline_db < migrations/001_initial_schema.sql
      - name: Run all tests with MySQL
        env:
          PPVP_DB_PASSWORD: pp_test_password
          PPVP_DB_HOST: 127.0.0.1
          PPVP_DB_USER: pp_user
          PPVP_DB_NAME: privacy_pipeline_db
        run: pytest tests/ -v -m "mysql or not mysql"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y libgl1
      - run: pip install numpy pandas opencv-python-headless cryptography pyyaml Pillow
      - run: python scripts/run_pipeline.py --frames 10 2>&1 || true
